<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header>
        <nav>
            <div class="nav-bar">
                <div class="logo"><img src="image/logo.png" alt=""></div>
                <ul class="nav-lists-items">
                    <li class="home-content"><a href="">home</a></li>
                    <li class="tour-content"><a href="">tour</a></li>
                    <li class="gallery-content"><a href="">gallery</a></li>
                </ul>
                <div class="form-dark">
                <div class="login-content">
                   <button class="login-icon"><i class="fa-solid fa-user"></i></button>
                </div>
                <div class="dark-mode">
                     <button class="sun-icon"><i class="fa-solid fa-sun"></i></button>
                </div>
                <div class="ham-bars">
                    <button class="bars"><i class="fa-solid fa-bars"></i></button>
                </div>
            </div>
            </div>
        </nav>
    </header>
    <section class ="form-content">
        <button class="closebtn"><i class="fa-solid fa-xmark"></i></button>
        <form class="login-form">
    <h2>Login</h2>

    <input type="email" placeholder="Enter your email" required>

    <input type="password" placeholder="Enter your password" required>

    <label>
        <input type="checkbox">
        Remember Me
    </label>

    <a href="#">Forgot Password?</a>

    <button type="submit" class = "submit-btn">Login</button>

    <p>Don't have an account? <a href="#" class="OpenSignUp">Sign Up</a></p>
</form>
    </section>
    <section class="signup-content">
        <button class="closebtn-2"><i class="fa-solid fa-xmark"></i></button>
        <div class="signup-container">
    <div class="signup-header">
      <h2>Create an Account</h2>
    </div>

    <form class="signup-form">
      <div class="input-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" placeholder="John Doe" required>
      </div>

      <div class="input-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="name@example.com" required>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 8 characters" required>
      </div>

      <div class="input-group">
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" placeholder="••••••••" required>
      </div>

      <div class="form-actions">
        <label class="terms">
          <input type="checkbox" required>
          <span>I agree to the <a href="#">Terms & Conditions</a></span>
        </label>
      </div>

      <button type="submit" class="submit-btn">Create Account</button>
    </form>

    <div class="signup-footer">
      <p>Already have an account? <a href="#" class="OpenSignIn">Sign in</a></p>
    </div>
  </div>
    </section>
    <section class="slider-part">
        <div class="slider-content">
            <div class="image-1">
             <img src="image/sliderimage-4.jpg" alt="">
        </div>
    </section>
    <section class="bts-member-details">
      <div class="bts-member-title"> bts Member's</div>
      <div class="bts-members">
      </div>
    </section>
    <section class="ablum-details">
      <div class="ablum-details-body">
        <div class="ablum-detail-tiltle">track list</div>
        <div class="disc-1"><img src="image/disc.png" alt="" class="disc-image-1"></div>
        <div class="disc-2"><img src="image/disc.png" alt=""  class="disc-image-2"></div>
        <div class="disc-3"><img src="image/disc.png" alt=""  class="disc-image-3"></div>
        <div class="tracklist"><img src="image/tracklist.png" alt=""></div>
        <button class="listen-btn"><a href="https://open.spotify.com/album/53OELuhrBiml1ns99FIfEN?si=4HFMrfftRwiYJnWGpokEpg" target="_blank">listen to spotify</a></button>
      </div>
    </section>
     <section class="gallery-details">
      <div class="gallery-detail-tiltle">gallery</div>
      <div class="gallery-images">
        <div class="gallery-image-1"><img src="image/image1.jpg" alt=""></div>
        <div class="gallery-image-2"><img src="image/image9.jpg" alt=""></div>
        <div class="gallery-image-3"><img src="image/image7.jpg" alt=""></div>
        <div class="gallery-image-4"><img src="image/image3.jpg" alt=""></div>
        <div class="gallery-image-5"><img src="image/image4.jpg" alt=""></div>
        <div class="gallery-image-6"><img src="image/image5.jpg" alt=""></div>
        <div class="gallery-image-7"><img src="image/image6.jpg" alt=""></div>
      </div>
      <button class="view-more-btn"><a href="">view more</a></button>
     </section>
    <script src="script.js"></script>
</body>
</html
